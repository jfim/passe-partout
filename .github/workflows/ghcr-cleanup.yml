name: ghcr-cleanup

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # dataaxiom/ghcr-cleanup-action understands multi-arch images: the
      # platform-specific manifests referenced by a tagged multi-arch index
      # are NOT treated as "untagged" and are preserved. The previous
      # actions/delete-package-versions step deleted them, leaving every tag
      # (latest, master, 0.x, ...) pointing at missing manifests and breaking
      # `docker pull` everywhere it was consumed.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: passe-partout
          delete-untagged: true
          keep-n-tagged: 10
          exclude-tags: latest,master,main,v*,*.*,*.*.*
